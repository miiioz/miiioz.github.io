<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f7fb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="MediLog">
<title>MediLog · 用药记录</title>
<link rel="manifest" href="./manifest.json">
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#1d2433;--muted:#778092;--line:#e7eaf0;--brand:#5968c9;--brand2:#7784e4;--green:#258a67;--amber:#a76a0a;--red:#ba4051;--soft:#eef1ff;--shadow:0 12px 30px rgba(30,38,60,.08)}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}body{margin:0;background:radial-gradient(circle at 12% 0,rgba(89,104,201,.11),transparent 32%),var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{width:min(100%,520px);margin:auto;min-height:100vh;padding:max(18px,env(safe-area-inset-top)) 16px calc(92px + env(safe-area-inset-bottom))}.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.brand{display:flex;align-items:center;gap:11px}.logo{width:44px;height:44px;border-radius:15px;background:linear-gradient(145deg,var(--brand2),var(--brand));display:grid;place-items:center;color:#fff;box-shadow:0 10px 24px rgba(89,104,201,.25);font-size:23px}.brand h1{font-size:21px;margin:0}.brand p{font-size:12px;color:var(--muted);margin:3px 0 0}.iconbtn{width:42px;height:42px;border:1px solid var(--line);border-radius:14px;background:#fff;color:var(--text)}.hero{padding:22px;border-radius:28px;color:#fff;background:linear-gradient(145deg,#7080df 0,#5968c9 58%,#4c58ae 100%);box-shadow:0 18px 38px rgba(76,88,174,.24);position:relative;overflow:hidden}.hero:after{content:"";position:absolute;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.10);right:-80px;top:-90px}.hero small{opacity:.8}.herorow{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:end;gap:14px;margin-top:9px}.herobig{font-size:31px;font-weight:800;line-height:1}.herosub{font-size:13px;opacity:.86;margin-top:8px}.badge{min-width:92px;padding:10px 12px;border-radius:16px;background:rgba(255,255,255,.14);text-align:center}.badge strong{display:block;font-size:23px}.badge span{font-size:11px;opacity:.85}.sectionhead{display:flex;justify-content:space-between;align-items:center;margin:22px 2px 10px}.sectionhead h2{margin:0;font-size:16px}.linkbtn{border:0;background:transparent;color:var(--brand);font-weight:700;font-size:13px}.list{display:grid;gap:12px}.card{background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:22px;padding:17px;box-shadow:var(--shadow)}.medtop{display:flex;justify-content:space-between;gap:12px;align-items:start}.medname{font-size:18px;font-weight:780}.meta{font-size:12px;color:var(--muted);margin-top:5px}.pill{padding:6px 9px;border-radius:999px;background:#eaf8f2;color:var(--green);font-size:11px;font-weight:750;white-space:nowrap}.pill.low{background:#fff4dc;color:var(--amber)}.pill.empty{background:#fff0f2;color:var(--red)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:15px}.stat{background:#f8f9fc;border-radius:15px;padding:11px 9px;min-width:0}.stat span{display:block;font-size:10px;color:var(--muted);margin-bottom:5px}.stat strong{font-size:14px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.note{font-size:12px;color:var(--muted);margin-top:10px}.actions{display:grid;grid-template-columns:1.4fr 1fr auto;gap:8px;margin-top:13px}.btn{border:1px solid var(--line);border-radius:13px;background:#fff;min-height:42px;padding:9px 12px;font-weight:700}.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}.btn.soft{background:var(--soft);border-color:transparent;color:var(--brand)}.btn.danger{color:var(--red);background:#fff0f2;border-color:#ffdbe1}.empty{text-align:center;padding:30px 20px}.empty .emoji{font-size:40px}.empty h3{margin:10px 0 6px}.empty p{color:var(--muted);font-size:13px;line-height:1.55;margin:0 0 16px}.timeline{display:grid;gap:9px}.event{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:17px;padding:12px 13px}.edot{width:34px;height:34px;border-radius:11px;background:#eef1ff;display:grid;place-items:center}.etitle{font-weight:700;font-size:13px}.esub{font-size:11px;color:var(--muted);margin-top:3px}.eqty{font-size:12px;font-weight:750}.fab{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(calc(100% - 32px),488px);z-index:10}.fab button{width:100%;height:54px;border:0;border-radius:18px;color:#fff;background:linear-gradient(145deg,#6c7bd9,#5968c9);font-weight:800;box-shadow:0 13px 28px rgba(89,104,201,.3)}dialog{border:0;padding:0;border-radius:24px;width:min(calc(100% - 24px),500px);max-height:88vh;box-shadow:0 24px 70px rgba(25,32,50,.24)}dialog::backdrop{background:rgba(20,25,40,.38);backdrop-filter:blur(3px)}.modal{padding:20px}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.modalhead h3{margin:0;font-size:19px}.close{width:36px;height:36px;border:0;border-radius:12px;background:#f2f4f8;font-size:22px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{margin-top:11px}.field label{display:block;font-size:12px;color:var(--muted);font-weight:650;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:#fff;border-radius:13px;padding:11px 12px;outline:none}.field textarea{min-height:76px;resize:vertical}.modalactions{display:grid;grid-template-columns:1fr 1.3fr;gap:9px;margin-top:18px}.smallhint{font-size:11px;color:var(--muted);line-height:1.5;margin-top:7px}.toast{position:fixed;left:50%;top:22px;transform:translate(-50%,-20px);background:#202633;color:#fff;padding:10px 14px;border-radius:12px;font-size:12px;opacity:0;pointer-events:none;transition:.2s;z-index:50}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:370px){.stats{grid-template-columns:1fr}.actions{grid-template-columns:1fr 1fr}.actions .edit{grid-column:1/-1}.herorow{align-items:start;flex-direction:column}}
</style>
</head>
<body>
<div class="app">
  <header class="topbar"><div class="brand"><div class="logo">✚</div><div><h1>MediLog</h1><p>药物 · 日期 · 库存</p></div></div><button class="iconbtn" id="settingsBtn">⚙︎</button></header>
  <section class="hero" id="hero"></section>
  <div class="sectionhead"><h2>我的药物</h2><button class="linkbtn" id="addTop">＋ 添加</button></div>
  <main class="list" id="medList"></main>
  <div class="sectionhead" id="historyHead"><h2>最近记录</h2><button class="linkbtn" id="allHistoryBtn">查看全部</button></div>
  <section class="timeline" id="timeline"></section>
</div>
<div class="fab"><button id="addBtn">＋ 添加药物</button></div>

<dialog id="medDialog"><form class="modal" id="medForm"><div class="modalhead"><h3 id="medTitle">添加药物</h3><button type="button" class="close" data-close="medDialog">×</button></div><input type="hidden" id="medId"><div class="field"><label>药物名称</label><input id="medName" required placeholder="例如：达必妥"></div><div class="grid2"><div class="field"><label>类型</label><select id="medType"><option>注射笔</option><option>预充针</option><option>片剂</option><option>胶囊</option><option>吸入剂</option><option>补充剂</option><option>其他</option></select></div><div class="field"><label>库存单位</label><input id="medUnit" value="支" required></div></div><div class="grid2"><div class="field"><label>当前库存</label><input id="medStock" type="number" min="0" step="0.5" value="0" required></div><div class="field"><label>每次使用</label><input id="medDose" type="number" min="0.1" step="0.1" value="1" required></div></div><div class="grid2"><div class="field"><label>计划间隔（天）</label><input id="medInterval" type="number" min="1" value="14" required></div><div class="field"><label>低库存提醒</label><input id="medLow" type="number" min="0" step="0.5" value="2"></div></div><div class="field" id="seedWrap"><label>最近一次用药日期（可选）</label><input id="medSeed" type="date"></div><div class="field"><label>备注（可选）</label><textarea id="medNotes" placeholder="剂量、部位或其他备注"></textarea></div><button type="button" class="btn danger" id="deleteBtn" style="display:none;width:100%;margin-top:14px">删除药物和记录</button><div class="modalactions"><button type="button" class="btn" data-close="medDialog">取消</button><button class="btn primary">保存</button></div></form></dialog>

<dialog id="doseDialog"><form class="modal" id="doseForm"><div class="modalhead"><h3>记录用药</h3><button type="button" class="close" data-close="doseDialog">×</button></div><input type="hidden" id="doseMedId"><div class="field"><label>药物</label><input id="doseName" disabled></div><div class="grid2"><div class="field"><label>日期</label><input id="doseDate" type="date" required></div><div class="field"><label>使用数量</label><input id="doseQty" type="number" min="0.1" step="0.1" required></div></div><div class="field"><label>备注（可选）</label><input id="doseNote" placeholder="例如：左腹部"></div><div class="smallhint" id="doseHint"></div><div class="modalactions"><button type="button" class="btn" data-close="doseDialog">取消</button><button class="btn primary">确认用药</button></div></form></dialog>

<dialog id="restockDialog"><form class="modal" id="restockForm"><div class="modalhead"><h3>补充库存</h3><button type="button" class="close" data-close="restockDialog">×</button></div><input type="hidden" id="restockMedId"><div class="field"><label>药物</label><input id="restockName" disabled></div><div class="grid2"><div class="field"><label>日期</label><input id="restockDate" type="date" required></div><div class="field"><label>增加数量</label><input id="restockQty" type="number" min="0.1" step="0.1" value="1" required></div></div><div class="field"><label>备注（可选）</label><input id="restockNote" placeholder="例如：药房领取"></div><div class="modalactions"><button type="button" class="btn" data-close="restockDialog">取消</button><button class="btn primary">加入库存</button></div></form></dialog>

<dialog id="historyDialog"><div class="modal"><div class="modalhead"><h3>全部记录</h3><button class="close" data-close="historyDialog">×</button></div><div class="timeline" id="allTimeline"></div></div></dialog>
<dialog id="settingsDialog"><div class="modal"><div class="modalhead"><h3>数据与备份</h3><button class="close" data-close="settingsDialog">×</button></div><p class="smallhint">所有用药数据只保存在当前浏览器。本页面不会把你的药物名称、库存或用药历史上传到 GitHub。</p><div style="display:grid;gap:9px;margin-top:14px"><button class="btn" id="exportBtn">导出 JSON 备份</button><button class="btn soft" id="importBtn">导入备份</button><input id="importFile" type="file" accept="application/json" hidden></div></div></dialog>
<div class="toast" id="toast"></div>
<script>
const KEY='medilog.state.v1';
let state=load();
const $=id=>document.getElementById(id);
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const pd=s=>s?new Date(s+'T12:00:00'):null;
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const add=(s,n)=>{const d=pd(s);if(!d)return null;d.setDate(d.getDate()+Number(n||0));return iso(d)};
const diff=(a,b)=>Math.round((pd(b)-pd(a))/86400000);
const fmt=s=>s?pd(s).toLocaleDateString('zh-CN',{month:'short',day:'numeric'}):'—';
const fmtY=s=>s?pd(s).toLocaleDateString('zh-CN',{year:'numeric',month:'short',day:'numeric'}):'—';
const num=n=>Number(n||0).toLocaleString('zh-CN',{maximumFractionDigits:1});
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x&&Array.isArray(x.medications)&&Array.isArray(x.events))return x}catch(e){}return{version:1,medications:[],events:[]}}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function med(id){return state.medications.find(m=>m.id===id)}
function doseDates(m){const a=state.events.filter(e=>e.medicationId===m.id&&e.type==='dose').map(e=>e.date);if(m.seedDate)a.push(m.seedDate);return [...new Set(a)].sort()}
function last(m){const a=doseDates(m);return a.length?a[a.length-1]:null}
function next(m){const l=last(m);return l?add(l,m.intervalDays):null}
function avg(m){const a=doseDates(m);if(a.length<2)return null;const ds=a.slice(1).map((d,i)=>diff(a[i],d));return ds.reduce((x,y)=>x+y,0)/ds.length}
function toast(t){$('toast').textContent=t;$('toast').classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>$('toast').classList.remove('show'),1800)}
function render(){renderHero();renderMeds();renderEvents();$('historyHead').style.display=state.events.length?'flex':'none'}
function renderHero(){let n=null;for(const m of state.medications){const d=next(m);if(d&&(!n||pd(d)<pd(n.date)))n={m,date:d}}if(!n){$('hero').innerHTML='<small>下一次预计用药</small><div class="herorow"><div><div class="herobig">还没有计划</div><div class="herosub">添加药物和最近一次日期后自动计算</div></div><div class="badge"><strong>'+state.medications.length+'</strong><span>种药物</span></div></div>';return}const d=diff(today(),n.date);const text=d===0?'今天':d>0?d+' 天后':'已过 '+Math.abs(d)+' 天';$('hero').innerHTML=`<small>下一次预计用药 · ${esc(n.m.name)}</small><div class="herorow"><div><div class="herobig">${text}</div><div class="herosub">${fmtY(n.date)} · 计划每 ${num(n.m.intervalDays)} 天</div></div><div class="badge"><strong>${num(n.m.stock)}</strong><span>剩余 ${esc(n.m.unit)}</span></div></div>`}
function renderMeds(){const root=$('medList');if(!state.medications.length){root.innerHTML='<div class="card empty"><div class="emoji">💊</div><h3>先添加第一种药物</h3><p>可以从达必妥开始。以后也能继续添加其他注射药、片剂、吸入剂或补充剂。</p><button class="btn primary" id="emptyAdd">添加药物</button></div>';$('emptyAdd').onclick=()=>openMed();return}root.innerHTML=state.medications.map(m=>{const l=last(m),n=next(m),a=avg(m),st=Number(m.stock),low=Number(m.lowStock||0);const c=st<=0?'empty':st<=low?'low':'';const doses=m.doseQty>0?Math.floor(st/m.doseQty):0;const label=st<=0?'库存为 0':st<=low?'库存偏低':'约 '+doses+' 次用量';return `<article class="card"><div class="medtop"><div><div class="medname">${esc(m.name)}</div><div class="meta">${esc(m.formType)} · 每次 ${num(m.doseQty)} ${esc(m.unit)} · 每 ${num(m.intervalDays)} 天</div></div><span class="pill ${c}">${label}</span></div><div class="stats"><div class="stat"><span>剩余库存</span><strong>${num(m.stock)} ${esc(m.unit)}</strong></div><div class="stat"><span>上次用药</span><strong>${fmt(l)}</strong></div><div class="stat"><span>下次预计</span><strong>${fmt(n)}</strong></div></div>${a?`<div class="note">历史平均实际间隔：${num(a)} 天</div>`:''}${m.notes?`<div class="note">${esc(m.notes)}</div>`:''}<div class="actions"><button class="btn primary dose" data-id="${m.id}">记录用药</button><button class="btn soft restock" data-id="${m.id}">补库存</button><button class="btn edit" data-id="${m.id}">编辑</button></div></article>`}).join('');root.querySelectorAll('.dose').forEach(b=>b.onclick=()=>openDose(b.dataset.id));root.querySelectorAll('.restock').forEach(b=>b.onclick=()=>openRestock(b.dataset.id));root.querySelectorAll('.edit').forEach(b=>b.onclick=()=>openMed(b.dataset.id))}
function events(){return [...state.events].sort((a,b)=>b.date.localeCompare(a.date)||String(b.createdAt).localeCompare(String(a.createdAt)))}
function eventHTML(e){const m=med(e.medicationId);if(!m)return'';const dose=e.type==='dose';return `<div class="event"><div class="edot">${dose?'💉':'📦'}</div><div><div class="etitle">${esc(m.name)} · ${dose?'用药':'补充库存'}</div><div class="esub">${fmtY(e.date)}${e.note?' · '+esc(e.note):''}</div></div><div class="eqty">${dose?'−':'＋'}${num(e.qty)} ${esc(m.unit)}</div></div>`}
function renderEvents(){const a=events();$('timeline').innerHTML=a.slice(0,5).map(eventHTML).join('');$('allTimeline').innerHTML=a.length?a.map(eventHTML).join(''):'<div class="empty"><p>还没有任何记录。</p></div>'}
function openMed(id){const m=id?med(id):null;$('medTitle').textContent=m?'编辑药物':'添加药物';$('medId').value=m?.id||'';$('medName').value=m?.name||'';$('medType').value=m?.formType||'注射笔';$('medUnit').value=m?.unit||'支';$('medStock').value=m?.stock??0;$('medDose').value=m?.doseQty??1;$('medInterval').value=m?.intervalDays??14;$('medLow').value=m?.lowStock??2;$('medSeed').value=m?.seedDate||'';$('medNotes').value=m?.notes||'';$('seedWrap').style.display=m?'none':'block';$('deleteBtn').style.display=m?'block':'none';$('deleteBtn').onclick=m?()=>removeMed(m.id):null;$('medDialog').showModal()}
function openDose(id){const m=med(id);$('doseMedId').value=id;$('doseName').value=m.name;$('doseDate').value=today();$('doseQty').value=m.doseQty;$('doseNote').value='';$('doseHint').textContent=`当前库存：${num(m.stock)} ${m.unit}。确认后自动扣减。`;$('doseDialog').showModal()}
function openRestock(id){const m=med(id);$('restockMedId').value=id;$('restockName').value=m.name;$('restockDate').value=today();$('restockQty').value=1;$('restockNote').value='';$('restockDialog').showModal()}
function removeMed(id){const m=med(id);if(!confirm(`确定删除“${m.name}”以及它的全部历史记录吗？`))return;state.medications=state.medications.filter(x=>x.id!==id);state.events=state.events.filter(e=>e.medicationId!==id);save();$('medDialog').close();render();toast('已删除')}
$('medForm').onsubmit=e=>{e.preventDefault();const id=$('medId').value;const data={name:$('medName').value.trim(),formType:$('medType').value,unit:$('medUnit').value.trim()||'份',stock:Number($('medStock').value),doseQty:Number($('medDose').value),intervalDays:Number($('medInterval').value),lowStock:Number($('medLow').value||0),notes:$('medNotes').value.trim()};if(!data.name||data.stock<0||data.doseQty<=0||data.intervalDays<=0)return;if(id)Object.assign(med(id),data,{updatedAt:new Date().toISOString()});else state.medications.push({id:uid(),...data,seedDate:$('medSeed').value||null,createdAt:new Date().toISOString()});save();$('medDialog').close();render();toast(id?'已更新':'已添加')};
$('doseForm').onsubmit=e=>{e.preventDefault();const m=med($('doseMedId').value),q=Number($('doseQty').value),d=$('doseDate').value;if(!m||q<=0||!d)return;if(q>Number(m.stock)){toast('库存不足');return}m.stock=Number(m.stock)-q;state.events.push({id:uid(),type:'dose',medicationId:m.id,date:d,qty:q,note:$('doseNote').value.trim(),createdAt:new Date().toISOString()});save();$('doseDialog').close();render();toast('用药记录已保存')};
$('restockForm').onsubmit=e=>{e.preventDefault();const m=med($('restockMedId').value),q=Number($('restockQty').value),d=$('restockDate').value;if(!m||q<=0||!d)return;m.stock=Number(m.stock)+q;state.events.push({id:uid(),type:'restock',medicationId:m.id,date:d,qty:q,note:$('restockNote').value.trim(),createdAt:new Date().toISOString()});save();$('restockDialog').close();render();toast('库存已更新')};
$('addBtn').onclick=$('addTop').onclick=()=>openMed();$('settingsBtn').onclick=()=>$('settingsDialog').showModal();$('allHistoryBtn').onclick=()=>{$('historyDialog').showModal();renderEvents()};document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>$(b.dataset.close).close());
$('exportBtn').onclick=()=>{const blob=new Blob([JSON.stringify({app:'MediLog',exportedAt:new Date().toISOString(),data:state},null,2)],{type:'application/json'});const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=`medilog-backup-${today()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);toast('备份已导出')};$('importBtn').onclick=()=>$('importFile').click();$('importFile').onchange=async()=>{const f=$('importFile').files[0];if(!f)return;try{const x=JSON.parse(await f.text()),d=x.data||x;if(!Array.isArray(d.medications)||!Array.isArray(d.events))throw 0;if(!confirm('导入会覆盖当前数据，是否继续？'))return;state=d;save();render();$('settingsDialog').close();toast('备份已导入')}catch(e){toast('备份文件无法读取')}$('importFile').value=''};
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));render();
</script>
</body>
</html>
